<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebForge — Learn HTML, CSS & JS Through Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ["Space Grotesk", "sans-serif"],
              body: ["IBM Plex Sans", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --bg: #0c0e14;
        --surface: #151820;
        --surface2: #1c1f2b;
        --border: #2a2e3d;
        --fg: #e4e5ea;
        --muted: #6c7086;
        --accent: #f97316;
        --accent2: #fb923c;
        --glow: rgba(249, 115, 22, 0.15);
        --success: #22c55e;
        --error: #ef4444;
        --warn: #eab308;
        --t1: #22c55e;
        --t2: #3b82f6;
        --t3: #a855f7;
        --t4: #ef4444;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: "IBM Plex Sans", sans-serif;
        overflow: hidden;
        height: 100vh;
      }
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }
      .CodeMirror {
        background: var(--surface) !important;
        color: var(--fg) !important;
        font-family: "JetBrains Mono", monospace !important;
        font-size: 13px !important;
        height: 100% !important;
        border: none !important;
        line-height: 1.6 !important;
      }
      .CodeMirror-gutters {
        background: var(--surface) !important;
        border-right: 1px solid var(--border) !important;
      }
      .CodeMirror-linenumber {
        color: #3a3e4f !important;
      }
      .CodeMirror-cursor {
        border-left: 2px solid var(--accent) !important;
      }
      .CodeMirror-selected {
        background: rgba(249, 115, 22, 0.12) !important;
      }
      .cm-s-material-darker .cm-keyword {
        color: #c792ea !important;
      }
      .cm-s-material-darker .cm-def {
        color: #82aaff !important;
      }
      .cm-s-material-darker .cm-string {
        color: #c3e88d !important;
      }
      .cm-s-material-darker .cm-number {
        color: #f78c6c !important;
      }
      .cm-s-material-darker .cm-tag {
        color: #f07178 !important;
      }
      .cm-s-material-darker .cm-attribute {
        color: #ffcb6b !important;
      }
      .cm-s-material-darker .cm-comment {
        color: #546e7a !important;
        font-style: italic;
      }
      .ember {
        position: fixed;
        width: 3px;
        height: 3px;
        background: var(--accent);
        border-radius: 50%;
        pointer-events: none;
        opacity: 0;
        z-index: 0;
        filter: blur(0.5px);
      }
      @keyframes ember-rise {
        0% {
          transform: translateY(0) translateX(0);
          opacity: 0;
        }
        8% {
          opacity: 0.4;
        }
        50% {
          opacity: 0.2;
        }
        100% {
          transform: translateY(-105vh) translateX(var(--d)) scale(0.2);
          opacity: 0;
        }
      }
      .toast-box {
        position: fixed;
        top: 66px;
        right: 14px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
      }
      .toast {
        padding: 10px 18px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        pointer-events: auto;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        border: 1px solid var(--border);
        animation:
          tin 0.3s ease,
          tout 0.3s ease 2.7s forwards;
      }
      .toast-s {
        background: #0a2e1a;
        border-color: #166534;
        color: #4ade80;
      }
      .toast-e {
        background: #2e0a0a;
        border-color: #7f1d1d;
        color: #f87171;
      }
      .toast-i {
        background: #1a1508;
        border-color: #854d0e;
        color: #fbbf24;
      }
      .toast-xp {
        background: linear-gradient(135deg, #2e1a00, #1a0e00);
        border-color: #c2410c;
        color: var(--accent2);
      }
      @keyframes tin {
        from {
          transform: translateX(120%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
      @keyframes tout {
        to {
          opacity: 0;
          transform: translateY(-8px);
        }
      }
      @keyframes glow-pulse {
        0%,
        100% {
          box-shadow: 0 0 8px var(--glow);
        }
        50% {
          box-shadow:
            0 0 24px var(--glow),
            0 0 48px rgba(249, 115, 22, 0.04);
        }
      }
      @keyframes check-pop {
        0% {
          transform: scale(0);
        }
        50% {
          transform: scale(1.2);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes confetti-fall {
        0% {
          transform: translateY(0) rotate(0);
          opacity: 1;
        }
        100% {
          transform: translateY(100vh) rotate(720deg);
          opacity: 0;
        }
      }
      @keyframes fire-f {
        0%,
        100% {
          transform: scaleY(1) scaleX(1);
        }
        25% {
          transform: scaleY(1.1) scaleX(0.95);
        }
        50% {
          transform: scaleY(0.95) scaleX(1.05);
        }
        75% {
          transform: scaleY(1.05) scaleX(0.98);
        }
      }
      .fire-i {
        animation: fire-f 0.8s ease-in-out infinite;
        display: inline-block;
      }
      .confetti {
        position: fixed;
        width: 8px;
        height: 8px;
        z-index: 99999;
        pointer-events: none;
        border-radius: 2px;
        animation: confetti-fall linear forwards;
      }
      .modal-bg {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.72);
        backdrop-filter: blur(8px);
        z-index: 1000;
        display: none;
        align-items: center;
        justify-content: center;
      }
      .modal-bg.on {
        display: flex;
      }
      .modal-c {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        max-height: 85vh;
        overflow: hidden;
        animation: modin 0.25s ease;
      }
      @keyframes modin {
        from {
          transform: scale(0.95) translateY(8px);
          opacity: 0;
        }
        to {
          transform: scale(1) translateY(0);
          opacity: 1;
        }
      }
      .rh {
        width: 4px;
        cursor: col-resize;
        background: var(--border);
        transition: background 0.2s;
        flex-shrink: 0;
      }
      .rh:hover,
      .rh.on {
        background: var(--accent);
      }
      .th {
        cursor: pointer;
        user-select: none;
        transition: background 0.15s;
      }
      .th:hover {
        background: var(--surface2);
      }
      .tc {
        transition: transform 0.2s;
      }
      .th.col .tc {
        transform: rotate(-90deg);
      }
      .pm {
        width: 375px !important;
        max-width: 100%;
        margin: 0 auto;
        border: 2px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }
      .pt {
        width: 768px !important;
        max-width: 100%;
        margin: 0 auto;
        border: 2px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }
      .pd {
        width: 100% !important;
      }
      .pc {
        transition: all 0.2s;
        border: 1px solid var(--border);
      }
      .pc:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      }
      .ta {
        color: var(--accent) !important;
        border-bottom: 2px solid var(--accent);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
        .ember {
          display: none;
        }
      }
    </style>
  </head>
  <body class="font-body">
    <div id="embers" aria-hidden="true"></div>
    <div class="toast-box" id="toasts"></div>

    <!-- Navbar -->
    <header
      class="h-14 flex items-center justify-between px-4 border-b relative z-50"
      style="background: var(--surface); border-color: var(--border)"
    >
      <div class="flex items-center gap-3">
        <button
          id="sb-tog"
          class="lg:hidden text-[var(--muted)] hover:text-[var(--fg)]"
          aria-label="Toggle sidebar"
        >
          <i class="fa-solid fa-bars text-lg"></i>
        </button>
        <div class="flex items-center gap-2">
          <div
            class="w-8 h-8 rounded-lg flex items-center justify-center text-white font-bold text-sm"
            style="background: linear-gradient(135deg, #f97316, #ea580c)"
          >
            <i class="fa-solid fa-fire text-xs"></i>
          </div>
          <span
            class="font-display font-bold text-lg tracking-tight hidden sm:block"
            >WebForge</span
          >
        </div>
        <nav class="hidden md:flex items-center gap-1 ml-3">
          <button
            onclick="openCat()"
            class="px-3 py-1.5 rounded-lg text-sm font-medium text-[var(--muted)] hover:text-[var(--fg)] hover:bg-[var(--surface2)] transition"
          >
            <i class="fa-solid fa-th-large mr-1.5"></i>Catalog
          </button>
          <button
            onclick="openSkills()"
            class="px-3 py-1.5 rounded-lg text-sm font-medium text-[var(--muted)] hover:text-[var(--fg)] hover:bg-[var(--surface2)] transition"
          >
            <i class="fa-solid fa-chart-pie mr-1.5"></i>Skills
          </button>
          <button
            onclick="openBadges()"
            class="px-3 py-1.5 rounded-lg text-sm font-medium text-[var(--muted)] hover:text-[var(--fg)] hover:bg-[var(--surface2)] transition"
          >
            <i class="fa-solid fa-award mr-1.5"></i>Badges
          </button>
        </nav>
      </div>
      <div class="flex items-center gap-4">
        <div>
          <span class="text-sm text-[var(--muted)]">XP</span>
          <span class="font-display font-bold text-[var(--accent2)]" id="xp-v"
            >0</span
          >
        </div>
        <div
          class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-sm"
          style="
            background: rgba(234, 88, 12, 0.1);
            border: 1px solid rgba(234, 88, 12, 0.2);
          "
        >
          <span class="fire-i text-orange-400"
            ><i class="fa-solid fa-fire text-xs"></i
          ></span>
          <span class="font-display font-semibold text-orange-300" id="streak-v"
            >0</span
          >
        </div>
      </div>
    </header>

    <!-- Layout -->
    <div class="flex" style="height: calc(100vh - 56px)">
      <!-- Sidebar -->
      <aside
        id="sidebar"
        class="w-60 flex-shrink-0 border-r overflow-y-auto transition-all duration-300"
        style="background: var(--surface); border-color: var(--border)"
      >
        <div class="p-3">
          <div class="relative">
            <i
              class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-[var(--muted)] text-xs"
            ></i
            ><input
              id="sb-search"
              type="text"
              placeholder="Search projects..."
              class="w-full pl-8 pr-3 py-2 rounded-lg text-sm border outline-none focus:border-[var(--accent)] transition"
              style="
                background: var(--surface2);
                border-color: var(--border);
                color: var(--fg);
              "
            />
          </div>
        </div>
        <div id="p-list" class="pb-4"></div>
      </aside>

      <!-- Editor Area -->
      <main class="flex-1 flex flex-col min-w-0">
        <div class="flex-1 flex min-h-0" id="epc">
          <!-- Editor -->
          <div class="flex flex-col min-w-0" id="ep" style="width: 50%">
            <div
              class="flex items-center border-b px-2"
              style="background: var(--surface2); border-color: var(--border)"
            >
              <button
                class="et ta px-4 py-2.5 text-sm font-medium font-mono transition"
                data-t="html"
                onclick="swTab('html')"
              >
                <i class="fa-brands fa-html5 mr-1.5 text-orange-400"></i>HTML
              </button>
              <button
                class="et px-4 py-2.5 text-sm font-medium font-mono text-[var(--muted)] hover:text-[var(--fg)] transition"
                data-t="css"
                onclick="swTab('css')"
              >
                <i class="fa-brands fa-css3-alt mr-1.5 text-blue-400"></i>CSS
              </button>
              <button
                class="et px-4 py-2.5 text-sm font-medium font-mono text-[var(--muted)] hover:text-[var(--fg)] transition"
                data-t="js"
                onclick="swTab('js')"
              >
                <i class="fa-brands fa-js mr-1.5 text-yellow-400"></i>JS
              </button>
              <div class="flex-1"></div>
              <button
                onclick="resetCode()"
                class="px-2 py-1.5 text-xs text-[var(--muted)] hover:text-[var(--fg)] transition"
                title="Reset"
              >
                <i class="fa-solid fa-rotate-left mr-1"></i>Reset
              </button>
            </div>
            <div class="flex-1 relative min-h-0">
              <div id="e-html" class="absolute inset-0"></div>
              <div id="e-css" class="absolute inset-0 hidden"></div>
              <div id="e-js" class="absolute inset-0 hidden"></div>
            </div>
          </div>
          <div class="rh" id="rhandle"></div>
          <!-- Preview -->
          <div class="flex flex-col min-w-0 flex-1" id="pp">
            <div
              class="flex items-center border-b px-3 gap-2"
              style="background: var(--surface2); border-color: var(--border)"
            >
              <span class="text-sm font-medium text-[var(--muted)]"
                >Preview</span
              >
              <div class="flex-1"></div>
              <div
                class="flex items-center gap-0.5 rounded-lg p-0.5"
                style="background: var(--surface)"
              >
                <button
                  onclick="setPM('mobile')"
                  class="pmb p-1.5 rounded text-[var(--muted)] hover:text-[var(--fg)] transition text-xs"
                  data-m="mobile"
                >
                  <i class="fa-solid fa-mobile-screen"></i>
                </button>
                <button
                  onclick="setPM('tablet')"
                  class="pmb p-1.5 rounded text-[var(--muted)] hover:text-[var(--fg)] transition text-xs"
                  data-m="tablet"
                >
                  <i class="fa-solid fa-tablet-screen-button"></i>
                </button>
                <button
                  onclick="setPM('desktop')"
                  class="pmb p-1.5 rounded text-[var(--accent)] transition text-xs"
                  data-m="desktop"
                >
                  <i class="fa-solid fa-desktop"></i>
                </button>
              </div>
              <button
                onclick="refreshPV()"
                class="p-1.5 rounded text-[var(--muted)] hover:text-[var(--fg)] transition text-xs"
              >
                <i class="fa-solid fa-arrows-rotate"></i>
              </button>
            </div>
            <div
              class="flex-1 overflow-hidden p-2"
              style="background: var(--bg)"
            >
              <div
                id="pw"
                class="w-full h-full pd rounded-lg overflow-hidden border"
                style="border-color: var(--border); background: #fff"
              >
                <iframe
                  id="pframe"
                  sandbox="allow-scripts allow-same-origin"
                  class="w-full h-full border-0"
                  title="Live preview"
                ></iframe>
              </div>
            </div>
          </div>
        </div>
        <!-- Bottom bar -->
        <div
          id="bbar"
          class="border-t px-4 py-2 flex items-center gap-3 flex-wrap"
          style="
            background: var(--surface);
            border-color: var(--border);
            min-height: 50px;
          "
        >
          <div
            id="checks-c"
            class="flex items-center gap-2 flex-1 min-w-0 overflow-x-auto"
          ></div>
          <div class="flex items-center gap-2 flex-shrink-0">
            <button
              onclick="showHint()"
              class="px-3 py-1.5 rounded-lg text-sm font-medium border transition hover:bg-[var(--surface2)]"
              style="border-color: var(--border); color: var(--warn)"
            >
              <i class="fa-solid fa-lightbulb mr-1"></i>Hint
            </button>
            <button
              onclick="runChecks()"
              class="px-3 py-1.5 rounded-lg text-sm font-medium border transition hover:bg-[var(--surface2)]"
              style="border-color: var(--border); color: var(--fg)"
            >
              <i class="fa-solid fa-check-double mr-1"></i>Check
            </button>
            <button
              onclick="submitProj()"
              class="px-4 py-1.5 rounded-lg text-sm font-bold text-white transition hover:opacity-90"
              style="background: linear-gradient(135deg, #f97316, #ea580c)"
            >
              <i class="fa-solid fa-rocket mr-1"></i>Submit
            </button>
            <button
              onclick="revealSol()"
              id="sol-btn"
              class="px-3 py-1.5 rounded-lg text-sm font-medium border transition hover:bg-[var(--surface2)]"
              style="border-color: var(--border); color: var(--muted)"
            >
              <i class="fa-solid fa-eye mr-1"></i>Solution
            </button>
          </div>
        </div>
      </main>
    </div>

    <!-- Welcome -->
    <div
      id="welcome"
      class="fixed inset-0 z-40 flex items-center justify-center"
      style="background: var(--bg)"
    >
      <div class="text-center max-w-lg px-6">
        <div
          class="w-20 h-20 rounded-2xl flex items-center justify-center mx-auto mb-6"
          style="
            background: linear-gradient(135deg, #f97316, #ea580c);
            box-shadow: 0 0 60px rgba(249, 115, 22, 0.3);
          "
        >
          <i class="fa-solid fa-fire text-white text-3xl"></i>
        </div>
        <h1
          class="font-display text-4xl sm:text-5xl font-bold mb-3 tracking-tight"
          style="
            background: linear-gradient(135deg, #f97316, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
          "
        >
          WebForge
        </h1>
        <p class="text-[var(--muted)] text-lg mb-8 leading-relaxed">
          Learn HTML, CSS & JavaScript by building
          <span class="text-[var(--fg)] font-medium">55 real projects</span>. No
          tutorials, no slides — just code.
        </p>
        <div class="flex flex-col sm:flex-row gap-3 justify-center">
          <button
            onclick="openCat()"
            class="px-6 py-3 rounded-xl font-display font-semibold text-white transition hover:scale-[1.02]"
            style="
              background: linear-gradient(135deg, #f97316, #ea580c);
              box-shadow: 0 4px 24px rgba(249, 115, 22, 0.3);
            "
          >
            Browse Projects
          </button>
          <button
            onclick="
              loadProj(1);
              document.getElementById('welcome').style.display = 'none';
            "
            class="px-6 py-3 rounded-xl font-display font-semibold border transition hover:bg-[var(--surface2)]"
            style="border-color: var(--border); color: var(--fg)"
          >
            Start with Project 1
          </button>
        </div>
        <div
          class="mt-10 flex justify-center gap-8 text-sm text-[var(--muted)]"
        >
          <div>
            <span class="text-[var(--fg)] font-bold text-lg block">55</span
            >Projects
          </div>
          <div>
            <span class="text-[var(--fg)] font-bold text-lg block">4</span>Tiers
          </div>
          <div>
            <span class="text-[var(--fg)] font-bold text-lg block">20+</span
            >Concepts
          </div>
        </div>
      </div>
    </div>

    <!-- Catalog Modal -->
    <div class="modal-bg" id="cat-m">
      <div
        class="modal-c w-[95vw] max-w-6xl flex flex-col"
        style="max-height: 85vh"
      >
        <div
          class="p-5 border-b flex items-center justify-between flex-shrink-0"
          style="border-color: var(--border)"
        >
          <h2 class="font-display text-xl font-bold">Project Catalog</h2>
          <button
            onclick="closeM('cat-m')"
            class="w-8 h-8 rounded-lg flex items-center justify-center hover:bg-[var(--surface2)] text-[var(--muted)]"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div
          class="p-4 border-b flex flex-col sm:flex-row gap-3 flex-shrink-0"
          style="border-color: var(--border)"
        >
          <div class="relative flex-1">
            <i
              class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-[var(--muted)] text-sm"
            ></i
            ><input
              id="cat-search"
              type="text"
              placeholder="Search by name or tag..."
              class="w-full pl-9 pr-4 py-2.5 rounded-lg text-sm border outline-none focus:border-[var(--accent)] transition"
              style="
                background: var(--surface2);
                border-color: var(--border);
                color: var(--fg);
              "
              oninput="filterCat()"
            />
          </div>
          <div class="flex gap-1.5 flex-wrap" id="cat-tiers"></div>
        </div>
        <div class="flex-1 overflow-y-auto p-4">
          <div
            id="cat-grid"
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"
          ></div>
          <p
            id="cat-empty"
            class="hidden text-center text-[var(--muted)] py-12"
          >
            No projects match your search.
          </p>
        </div>
      </div>

            css: "body{display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;background:#0f172a;font-family:sans-serif;color:#e2e8f0}\n.chat{width:450px;max-width:95vw;background:#1e293b;border-radius:16px;overflow:hidden;border:1px solid #334155;display:flex;flex-direction:column;height:650px}\n.ch{padding:1rem;border-bottom:1px solid #334155}\n.bot-info{display:flex;align-items:center;gap:.75rem}\n.avatar{width:40px;height:40px;border-radius:50%;background:#f97316;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}\n.st{color:#22c55e;font-size:.8rem}\n.msgs{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.75rem}\n.msg{max-width:85%;padding:.75rem 1rem;border-radius:12px;font-size:.95rem;line-height:1.5;animation:mi .3s}\n@keyframes mi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}\n.msg.bot{background:#334155;align-self:flex-start;border-bottom-left-radius:4px}\n.msg.user{background:#f97316;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}\n.ia{display:flex;gap:.5rem;padding:1rem;border-top:1px solid #334155}\ninput{flex:1;padding:.75rem;border:2px solid #334155;border-radius:8px;background:#0f172a;color:#e2e8f0;outline:none}\nbutton{padding:.75rem 1.5rem;border:none;border-radius:8px;background:#f97316;color:#fff;font-weight:600;cursor:pointer}",
            js: '// Simulated AI responses based on keywords\n// If user mentions "html": respond about HTML\n// If "css": respond about CSS\n// If "js"/"javascript": respond about JS\n// Otherwise: generic helpful response\n// Show typing indicator, then response after delay',
          },
          c: [
            { s: "#msgs", m: "Messages" },
            { s: "#mi", m: "Input" },
            { s: "#snd", m: "Send" },
          ],
          h: [
            "Keyword matching for simulated responses",
            "Show typing indicator div, remove after delay",
            "scrollTo bottom on each new message",
          ],
        },
      ];

      /* ===== STATE ===== */
      let state = {
        xp: 0,
        streak: 0,
        completed: [],
        hintsUsed: {},
        currentProj: null,
        activeTab: "html",
      };
      // Load from localStorage
      try {
        const saved = JSON.parse(localStorage.getItem("wf-state"));
        if (saved) {
          state.xp = saved.xp || 0;
          state.streak = saved.streak || 0;
          state.completed = saved.completed || [];
          state.hintsUsed = saved.hintsUsed || {};
        }
      } catch (e) {}
      function saveState() {
        try {
          localStorage.setItem(
            "wf-state",
            JSON.stringify({
              xp: state.xp,
              streak: state.streak,
              completed: state.completed,
              hintsUsed: state.hintsUsed,
            }),
          );
        } catch (e) {}
      }

      /* ===== CODEMIRROR EDITORS ===== */
      let editors = {};
      function initEditors() {
        const opts = {
          theme: "material-darker",
          lineNumbers: true,
          lineWrapping: true,
          tabSize: 2,
          indentWithTabs: false,
          autoCloseBrackets: true,
        };
        editors.html = CodeMirror(document.getElementById("e-html"), {
          ...opts,
          mode: "htmlmixed",
        });
        editors.css = CodeMirror(document.getElementById("e-css"), {
          ...opts,
          mode: "css",
        });
        editors.js = CodeMirror(document.getElementById("e-js"), {
          ...opts,
          mode: "javascript",
        });
        // Live preview on change
        Object.values(editors).forEach((ed) => {
          ed.on("change", () => {
            clearTimeout(ed._deb);
            ed._deb = setTimeout(updatePreview, 300);
          });
        });
      }

      /* ===== PREVIEW ===== */
      function updatePreview() {
        const frame = document.getElementById("pframe");
        const html = editors.html.getValue();
        const css = editors.css.getValue();
        const js = editors.js.getValue();
        const doc = `<!DOCTYPE html><html><head><style>${css}</style></head><body>${html}<script>${js}<\/script></body></html>`;
        frame.srcdoc = doc;
      }
      function refreshPV() {
        updatePreview();
        toast("Preview refreshed", "i");
      }

      /* ===== TAB SWITCHING ===== */
      function swTab(tab) {
        state.activeTab = tab;
        document.querySelectorAll(".et").forEach((b) => {
          b.classList.remove("ta");
          b.style.color = b.dataset.t === tab ? "" : "var(--muted)";
        });
        document.querySelector(`.et[data-t="${tab}"]`).classList.add("ta");
        ["html", "css", "js"].forEach((t) => {
          document.getElementById("e-" + t).style.display =
            t === tab ? "block" : "none";
        });
        editors[tab].refresh();
        editors[tab].focus();
      }

      /* ===== PREVIEW MODES ===== */
      function setPM(m) {
        const w = document.getElementById("pw");
        w.className =
          "w-full h-full " +
          (m === "mobile" ? "pm" : m === "tablet" ? "pt" : "pd") +
          " rounded-lg overflow-hidden border";
        w.style.borderColor = "var(--border)";
        w.style.background = "#fff";
        document.querySelectorAll(".pmb").forEach((b) => {
          b.style.color = b.dataset.m === m ? "var(--accent)" : "var(--muted)";
        });
      }

      /* ===== RESIZE HANDLE ===== */
      function initResize() {
        const h = document.getElementById("rhandle"),
          ep = document.getElementById("ep");
        let dragging = false,
          startX,
          startW;
        h.addEventListener("mousedown", (e) => {
          dragging = true;
          startX = e.clientX;
          startW = ep.offsetWidth;
          h.classList.add("on");
          document.body.style.cursor = "col-resize";
          document.body.style.userSelect = "none";
          e.preventDefault();
        });
        document.addEventListener("mousemove", (e) => {
          if (!dragging) return;
          const nw = Math.max(
            250,
            Math.min(startW + (e.clientX - startX), window.innerWidth - 300),
          );
          ep.style.width = nw + "px";
          Object.values(editors).forEach((ed) => ed.refresh());
        });
        document.addEventListener("mouseup", () => {
          if (dragging) {
            dragging = false;
            h.classList.remove("on");
            document.body.style.cursor = "";
            document.body.style.userSelect = "";
          }
        });
      }

      /* ===== PROJECT LOADING ===== */
      function loadProj(id) {
        const proj = P.find((p) => p.id === id);
        if (!proj) return;
        state.currentProj = id;
        saveState();
        editors.html.setValue(proj.s.html);
        editors.css.setValue(proj.s.css);
        editors.js.setValue(proj.s.js);
        swTab("html");
        updatePreview();
        renderChecks([]);
        // Highlight in sidebar
        document.querySelectorAll(".p-item").forEach((el) => {
          el.style.background = el.dataset.id == id ? "var(--surface2)" : "";
          el.style.borderLeft =
            el.dataset.id == id
              ? "3px solid var(--accent)"
              : "3px solid transparent";
        });
        // Close welcome if open
        const w = document.getElementById("welcome");
        if (w) w.style.display = "none";
        // Update bottom bar visibility
        document.getElementById("bbar").style.display = "flex";
        // Update solution button
        document.getElementById("sol-btn").style.display =
          state.completed.includes(id) ? "none" : "inline-flex";
      }

      /* ===== RESET CODE ===== */
      function resetCode() {
        if (!state.currentProj) return;
        const proj = P.find((p) => p.id === state.currentProj);
        editors.html.setValue(proj.s.html);
        editors.css.setValue(proj.s.css);
        editors.js.setValue(proj.s.js);
        swTab("html");
        updatePreview();
        renderChecks([]);
        toast("Code reset to starter", "i");
      }

      /* ===== AUTO-CHECKS ===== */
      function runChecks() {
        if (!state.currentProj) return;
        const proj = P.find((p) => p.id === state.currentProj);
        const frame = document.getElementById("pframe");
        const results = [];
        proj.c.forEach((ch) => {
          try {
            const doc = frame.contentDocument;
            if (!doc) {
              results.push({ ...ch, pass: false });
              return;
            }
            if (
              ch.s.startsWith(".") ||
              ch.s.startsWith("#") ||
              ch.s.startsWith("[")
            ) {
              const el = doc.querySelector(ch.s);
              results.push({ ...ch, pass: !!el });
            } else {
              const el = doc.querySelector(ch.s);
              results.push({ ...ch, pass: !!el });
            }
          } catch (e) {
            results.push({ ...ch, pass: false });
          }
        });
        renderChecks(results);
        const passed = results.filter((r) => r.pass).length;
        if (passed === results.length) toast("All checks passed!", "s");
        else toast(`${passed}/${results.length} checks passed`, "i");
      }

      function renderChecks(results) {
        const c = document.getElementById("checks-c");
        if (!results.length) {
          c.innerHTML =
            '<span class="text-xs text-[var(--muted)]">Click "Check" to verify your project</span>';
          return;
        }
        c.innerHTML = results
          .map(
            (r) =>
              `<div class="flex items-center gap-1.5 text-xs px-2 py-1 rounded-md ${r.pass ? "bg-green-900/30 text-green-400" : "bg-red-900/30 text-red-400"}" style="animation:check-pop .3s ease"><i class="fa-solid ${r.pass ? "fa-check" : "fa-xmark"}"></i>${r.m}</div>`,
          )
          .join("");
      }

      /* ===== HINTS ===== */
      function showHint() {
        if (!state.currentProj) return;
        const proj = P.find((p) => p.id === state.currentProj);
        const used = state.hintsUsed[proj.id] || 0;
        if (used >= proj.h.length) {
          toast("No more hints available", "i");
          return;
        }
        state.hintsUsed[proj.id] = used + 1;
        saveState();
        document.getElementById("hint-txt").textContent = proj.h[used];
        document.getElementById("hint-m").classList.add("on");
      }

      /* ===== SUBMIT ===== */
      function submitProj() {
        if (!state.currentProj) return;
        const proj = P.find((p) => p.id === state.currentProj);
        if (state.completed.includes(proj.id)) {
          toast("Already completed!", "i");
          return;
        }
        // Run checks first
        const frame = document.getElementById("pframe");
        let allPass = true;
        proj.c.forEach((ch) => {
          try {
            if (
              !frame.contentDocument ||
              !frame.contentDocument.querySelector(ch.s)
            )
              allPass = false;
          } catch (e) {
            allPass = false;
          }
        });
        // Complete anyway (encouragement-first approach)
        state.completed.push(proj.id);
        const hintsUsed = state.hintsUsed[proj.id] || 0;
        const xpEarned = Math.max(1, proj.xp - hintsUsed * 2);
        state.xp += xpEarned;
        // Streak
        const today = new Date().toDateString();
        const lastDate = localStorage.getItem("wf-lastdate");
        if (lastDate !== today) {
          state.streak++;
          localStorage.setItem("wf-lastdate", today);
        }
        saveState();
        updateUI();
        renderSidebar();
        toast(`+${xpEarned} XP earned!`, "xp");
        spawnConfetti();
        document.getElementById("sol-btn").style.display = "none";
        checkBadges();
      }

      /* ===== SOLUTION REVEAL ===== */
      function revealSol() {
        if (!state.currentProj) return;
        // For MVP, solutions aren't included in starter — show a message
        toast(
          "Solutions unlock after completing 3 projects in the same tier",
          "i",

      /* ===== SIDEBAR ===== */
      function renderSidebar(filter = "") {
        const list = document.getElementById("p-list");
        const tiers = [
          { t: 1, n: "HTML/CSS Basics", c: "var(--t1)" },
          { t: 2, n: "JS Fundamentals", c: "var(--t2)" },
          { t: 3, n: "Intermediate", c: "var(--t3)" },
          { t: 4, n: "Advanced", c: "var(--t4)" },
        ];
        let html = "";
        tiers.forEach((tier) => {
          const projects = P.filter(
            (p) =>
              p.t === tier.t &&
              p.n.toLowerCase().includes(filter.toLowerCase()),
          );
          if (!projects.length) return;
          const done = projects.filter((p) =>
            state.completed.includes(p.id),
          ).length;
          html += `<div class="mb-1"><div class="th flex items-center gap-2 px-3 py-2" onclick="this.classList.toggle('col')"><i class="fa-solid fa-chevron-down tc text-xs" style="color:${tier.c}"></i><span class="text-xs font-semibold tracking-wide" style="color:${tier.c}">${tier.n}</span><span class="ml-auto text-xs text-[var(--muted)]">${done}/${projects.length}</span></div><div class="pl-3">`;
          projects.forEach((p) => {
            const isDone = state.completed.includes(p.id);
            html += `<div class="p-item flex items-center gap-2 px-3 py-2 cursor-pointer text-sm hover:bg-[var(--surface2)] transition ${state.currentProj === p.id ? "bg-[var(--surface2)]" : ""}" style="border-left:3px solid ${state.currentProj === p.id ? "var(--accent)" : "transparent"}" data-id="${p.id}" onclick="loadProj(${p.id})"><i class="fa-solid ${isDone ? "fa-check-circle text-green-500" : "fa-circle text-[var(--border)]"} text-xs"></i><span class="truncate ${isDone ? "text-[var(--muted)]" : ""}">${p.n}</span></div>`;
          });
          html += `</div></div>`;
        });
        list.innerHTML = html;
      }
      document
        .getElementById("sb-search")
        .addEventListener("input", (e) => renderSidebar(e.target.value));

      /* ===== CATALOG ===== */
      let catTier = "all";
      function openCat() {
        document.getElementById("cat-m").classList.add("on");
        renderCatTiers();
        renderCatGrid();
      }
      function renderCatTiers() {
        const tiers = [
          { v: "all", n: "All", bg: "var(--accent)", fg: "#fff" },
          { v: "1", n: "T1 Basics", bg: "var(--surface2)", fg: "var(--t1)" },
          { v: "2", n: "T2 JS Fund.", bg: "var(--surface2)", fg: "var(--t2)" },
          { v: "3", n: "T3 Intermed.", bg: "var(--surface2)", fg: "var(--t3)" },
          { v: "4", n: "T4 Advanced", bg: "var(--surface2)", fg: "var(--t4)" },

        document.getElementById("cat-tiers").innerHTML = tiers
          .map(

      function filterCat() {

      function renderCatGrid() {
        const search = (
          document.getElementById("cat-search")?.value || ""

        const filtered = P.filter(
          (p) =>
            (catTier === "all" || p.t == catTier) &&
            (p.n.toLowerCase().includes(search) ||
              p.tg.some((t) => t.includes(search))),
        );
        const grid = document.getElementById("cat-grid");
        const empty = document.getElementById("cat-empty");
        if (!filtered.length) {
          grid.innerHTML = "";
          empty.classList.remove("hidden");
          return;
        }
        empty.classList.add("hidden");
        const tc = {
          1: "var(--t1)",
          2: "var(--t2)",
          3: "var(--t3)",
          4: "var(--t4)",
        };
        const tl = {
          1: "Beginner",
          2: "JS Fund.",
          3: "Intermediate",
          4: "Advanced",

        grid.innerHTML = filtered

            const done = state.completed.includes(p.id);

      /* ===== SKILLS RADAR ===== */

      function getSkillData() {
        const tags = {};
        state.completed.forEach((id) => {
          const p = P.find((x) => x.id === id);
          if (p)
            p.tg.forEach((t) => {
              tags[t] = (tags[t] || 0) + 1;
            });
        });
        const data = {};
        Object.entries(skillMap).forEach(([cat, ts]) => {
          const total = ts.length;
          const hit = ts.filter((t) => tags[t]).length;
          data[cat] = Math.round((hit / Math.max(1, total)) * 100);
        });
        return data;

      function renderRadar(data) {

        {
          id: "xp100",
          name: "Century Club",
          desc: "Earn 100+ XP",
          icon: "fa-medal",
          check: () => state.xp >= 100,
        },
        {
          id: "xp500",
          name: "XP Hunter",
          desc: "Earn 500+ XP",
          icon: "fa-shield",
          check: () => state.xp >= 500,
        },
        {
          id: "no-hints",
          name: "Self-Solver",
          desc: "Complete 5 projects without hints",
          icon: "fa-lightbulb",
          check: () =>
            state.completed.filter(
              (id) => !state.hintsUsed[id] || state.hintsUsed[id] === 0,
            ).length >= 5,
        },
      ];
      let earnedBadges = new Set();
      try {
        const eb = JSON.parse(localStorage.getItem("wf-badges"));
        if (Array.isArray(eb)) earnedBadges = new Set(eb);
      } catch (e) {}
      function saveBadges() {
        try {
          localStorage.setItem("wf-badges", JSON.stringify([...earnedBadges]));
        } catch (e) {}
      }
      function checkBadges() {
        BADGES.forEach((b) => {
          if (!earnedBadges.has(b.id) && b.check()) {
            earnedBadges.add(b.id);
            toast(`Badge earned: ${b.name}!`, "s");
            saveBadges();
          }
        });
      }
      function openBadges() {
        document.getElementById("badges-m").classList.add("on");
        document.getElementById("badges-g").innerHTML = BADGES.map((b) => {
          const earned = earnedBadges.has(b.id);
          return `<div class="p-4 rounded-xl border text-center transition ${earned ? "" : "opacity-40"}" style="background:var(--surface);border-color:${earned ? "var(--accent)" : "var(--border)"}"><div class="w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-3 text-xl" style="background:${earned ? "linear-gradient(135deg,#F97316,#EA580C)" : "var(--surface2)"};color:${earned ? "#fff" : "var(--muted)"}"><i class="fa-solid ${b.icon}"></i></div><h4 class="font-display font-semibold text-sm mb-1">${b.name}</h4><p class="text-xs text-[var(--muted)]">${b.desc}</p>${earned ? '<span class="text-[10px] text-green-500 mt-2 block"><i class="fa-solid fa-check mr-1"></i>Earned</span>' : ""}</div>`;
        }).join("");
      }

      /* ===== UI UPDATE ===== */
      function updateUI() {
        document.getElementById("xp-v").textContent = state.xp;
        document.getElementById("streak-v").textContent = state.streak;
      }

      /* ===== MODALS ===== */
      function closeM(id) {
        document.getElementById(id).classList.remove("on");
      }
      document.querySelectorAll(".modal-bg").forEach((m) => {
        m.addEventListener("click", (e) => {
          if (e.target === m) m.classList.remove("on");
        });
      });

      /* ===== TOAST ===== */
      function toast(msg, type = "i") {
        const c = document.getElementById("toasts");
        const t = document.createElement("div");
        t.className = "toast toast-" + type;
        t.textContent = msg;
        c.appendChild(t);
        setTimeout(() => t.remove(), 3100);
      }

      /* ===== CONFETTI ===== */
      function spawnConfetti() {
        const colors = [
          "#F97316",
          "#FBBF24",
          "#22C55E",
          "#3B82F6",
          "#A855F7",
          "#EF4444",
        ];
        for (let i = 0; i < 40; i++) {
          const c = document.createElement("div");
          c.className = "confetti";
          c.style.left = Math.random() * 100 + "vw";
          c.style.top = "-10px";
          c.style.background =
            colors[Math.floor(Math.random() * colors.length)];
          c.style.animationDuration = 1.5 + Math.random() * 2 + "s";
          c.style.animationDelay = Math.random() * 0.5 + "s";
          c.style.transform = `rotate(${Math.random() * 360}deg)`;
          document.body.appendChild(c);
          setTimeout(() => c.remove(), 4000);
        }
      }

      /* ===== EMBER PARTICLES ===== */
      function initEmbers() {
        const c = document.getElementById("embers");
        for (let i = 0; i < 15; i++) {
          const e = document.createElement("div");
          e.className = "ember";
          e.style.left = Math.random() * 100 + "vw";
          e.style.bottom = "-10px";
          e.style.setProperty("--d", Math.random() * 60 - 30 + "px");
          e.style.animation = `ember-rise ${6 + Math.random() * 8}s linear ${Math.random() * 10}s infinite`;
          e.style.width = 2 + Math.random() * 3 + "px";
          e.style.height = e.style.width;
          c.appendChild(e);
        }
      }

      /* ===== SIDEBAR TOGGLE (mobile) ===== */
      document.getElementById("sb-tog").addEventListener("click", () => {
        const sb = document.getElementById("sidebar");
        sb.style.display = sb.style.display === "none" ? "block" : "none";
      });

      /* ===== INIT ===== */
      function init() {
        initEditors();
        initResize();
        initEmbers();
        renderSidebar();
        updateUI();
        checkBadges();
        // Load last project if any
        if (state.currentProj) {
          loadProj(state.currentProj);
        } else {
          document.getElementById("bbar").style.display = "none";
        }
        // Keyboard shortcuts
        document.addEventListener("keydown", (e) => {
          if (e.ctrlKey && e.key === "1") {
            e.preventDefault();
            swTab("html");
          }
          if (e.ctrlKey && e.key === "2") {
            e.preventDefault();
            swTab("css");
          }
          if (e.ctrlKey && e.key === "3") {
            e.preventDefault();
            swTab("js");
          }
          if (e.ctrlKey && e.key === "Enter") {
            e.preventDefault();
            runChecks();
          }
        });
      }
      init();
    </script>
  </body>
</html>
