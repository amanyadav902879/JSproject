{t:'h1',v:'Variables in JavaScript'},
{t:'p',v:'JavaScript mein variables declare karne ke 3 tarike hain: <code class="bg-fg-card px-1.5 py-0.5 rounded text-fg-accent text-sm font-mono">var</code>, <code class="bg-fg-card px-1.5 py-0.5 rounded text-fg-accent text-sm font-mono">let</code>, aur <code class="bg-fg-card px-1.5 py-0.5 rounded text-fg-accent text-sm font-mono">const</code>. Har ek ka behavior alag hai.'},
{t:'h2',v:'const \u2014 Reassign Nahi Hota'},
{t:'p',v:'<code class="bg-fg-card px-1.5 py-0.5 rounded text-fg-accent text-sm font-mono">const</code> use karo jab value change nahi honi chahiye. Block-scoped hai.'},

function loadProg(){try{var p=localStorage.getItem('jsforge-p');return p?JSON.parse(p):{};}catch(e){return {};}}
function saveProg(){localStorage.setItem('jsforge-p',JSON.stringify(prog));}
var prog=loadProg();
function isDone(m,s){return !!(prog[m]&&prog[m][s]);}
function markDone(m,s){if(!prog[m])prog[m]={};prog[m][s]=true;saveProg();}
function modProg(m){var p=prog[m]||{};return['lesson','workshop','lab'].filter(function(s){return p[s];}).length;}
function totalProg(){return MODS.reduce(function(s,m){return s+modProg(m.id);},0);}

// ===== EDITOR =====
var editor=null;
function makeEditor(id,code){
  killEditor();var ta=document.getElementById(id);
  if(!ta||typeof CodeMirror==='undefined')return null;
  editor=CodeMirror.fromTextArea(ta,{mode:'javascript',theme:'material-darker',lineNumbers:true,matchBrackets:true,autoCloseBrackets:true,indentUnit:2,tabSize:2});
  editor.setValue(code);setTimeout(function(){if(editor)editor.refresh();},60);return editor;
}
function killEditor(){if(editor){try{editor.toTextArea();}catch(e){}editor=null;}}
function getCode(){return editor?editor.getValue():'';}

// ===== EXECUTION =====
function exec(code){
  var logs=[];var orig=console.log;
  console.log=function(){var args=[];for(var i=0;i<arguments.length;i++){var a=arguments[i];args.push(typeof a==='object'?JSON.stringify(a,null,2):String(a));}logs.push(args.join(' '));};

var pAnim=null;
function startParticles(cv){
  if(pAnim)cancelAnimationFrame(pAnim);var ctx=cv.getContext('2d');var ps=[];
  function resize(){cv.width=cv.parentElement.clientWidth;cv.height=cv.parentElement.clientHeight;}resize();
  window.addEventListener('resize',resize);
  for(var i=0;i<35;i++)ps.push({x:Math.random()*cv.width,y:Math.random()*cv.height,sz:Math.random()*2.5+0.5,vy:-(Math.random()*1+0.3),vx:(Math.random()-0.5)*0.3,op:Math.random()*0.5+0.2,h:Math.random()*30+25});
  function draw(){ctx.clearRect(0,0,cv.width,cv.height);for(var i=0;i<ps.length;i++){var p=ps[i];p.y+=p.vy;p.x+=p.vx;p.op-=0.001;if(p.y<-10||p.op<=0){ps[i]={x:Math.random()*cv.width,y:cv.height+10,sz:Math.random()*2.5+0.5,vy:-(Math.random()*1+0.3),vx:(Math.random()-0.5)*0.3,op:Math.random()*0.5+0.2,h:Math.random()*30+25};continue;}ctx.beginPath();ctx.arc(p.x,p.y,Math.max(0.1,p.sz),0,Math.PI*2);ctx.fillStyle='hsla('+p.h+',90%,58%,'+Math.max(0,p.op)+')';ctx.fill();}pAnim=requestAnimationFrame(draw);}
  draw();
}
function stopParticles(){if(pAnim){cancelAnimationFrame(pAnim);pAnim=null;}}

  h+='<div class="flex-1 min-w-0"><div class="text-[11px] text-fg-muted">'+m.title+' \u2014 Lab</div><div class="font-bold text-sm truncate">'+lab.title+'</div></div>';
  h+='<div class="flex items-center gap-1.5 text-xs font-mono text-fg-muted bg-fg-card px-3 py-1.5 rounded-lg border border-fg-border"><i class="fa-solid fa-clock text-[10px]"></i><span id="ltimer">'+mins+':'+secs+'</span></div>';
  if(allP)h+='<span class="text-xs text-emerald-400 bg-emerald-400/10 px-2.5 py-1 rounded-full"><i class="fa-solid fa-check mr-1"></i>All Passed</span>';
  h+='</div>';
  h+='<div class="p-4 border-b border-fg-border bg-fg-surface/30 shrink-0"><p class="text-sm text-fg-muted leading-relaxed">'+lab.desc+'</p>';
  h+='<div class="mt-2 flex items-center gap-3 text-[11px] text-fg-muted"><span><i class="fa-solid fa-list-check mr-1"></i>'+lab.tests.length+' test cases</span><span class="text-amber-400/70"><i class="fa-solid fa-triangle-exclamation mr-1"></i>No hints</span></div></div>';
  h+='<div class="flex-1 flex flex-col overflow-hidden">';
  h+='<div class="px-4 py-2 border-b border-fg-border bg-fg-card flex items-center justify-between shrink-0"><span class="text-xs text-fg-muted font-mono"><i class="fa-solid fa-code mr-1.5"></i>solution.js</span>';
  h+='<button onclick="runLab('+mid+')" class="bp px-4 py-1.5 rounded-md text-xs"><i class="fa-solid fa-flask mr-1.5"></i>Run Tests</button></div>';
  h+='<div class="flex-1 overflow-hidden" style="min-height:160px"><textarea id="lab-ed">'+esc(lab.init)+'</textarea></div></div>';
  h+='<div class="border-t border-fg-border shrink-0" style="height:190px">';
  h+='<div class="px-4 py-1.5 border-b border-fg-border bg-fg-card flex items-center justify-between"><span class="text-[11px] text-fg-muted font-mono">Test Results</span>';
  if(S.testRes){var pc=S.testRes.filter(function(t){return t.passed;}).length;h+='<span class="text-[11px] '+(pc===S.testRes.length?'text-emerald-400':'text-fg-muted')+'">'+pc+'/'+S.testRes.length+' passed</span>';}
  h+='</div><div id="lab-res" class="p-3 overflow-y-auto bg-[#0D0D0D]" style="height:155px">';
  if(S.testRes)h+=rTestRes(S.testRes);else h+='<span class="text-fg-muted text-xs">Click "Run Tests" to validate...</span>';
  h+='</div></div></div>';return h;
}

function rTestRes(res){
  var h='';for(var i=0;i<res.length;i++){var t=res[i];
  h+='<div class="flex items-start gap-3 py-2 af'+(i<res.length-1?' border-b border-fg-border/50':'')+'" style="animation-delay:'+(i*0.05)+'s">';
  h+='<div class="mt-0.5">'+(t.passed?'<i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>':'<i class="fa-solid fa-circle-xmark text-red-400 text-sm"></i>')+'</div>';
  h+='<div class="flex-1 min-w-0"><div class="text-xs '+(t.passed?'text-emerald-300':'text-red-300')+'">'+esc(t.name)+'</div>';
  if(t.error)h+='<div class="text-[11px] text-red-400/70 mt-0.5 font-mono">'+esc(t.error)+'</div>';
  h+='</div></div>';}return h;
}

function runLab(mid){
  var lab=LABS[mid];var code=getCode();var resEl=document.getElementById('lab-res');
  var tc='var __tr=[];';
  for(var i=0;i<lab.tests.length;i++){var sn=lab.tests[i].n.replace(/\\/g,'\\\\').replace(/"/g,'\\"');
  tc+='try{var __p=(function(){'+lab.tests[i].f+'})();__tr.push({name:"'+sn+'",passed:__p,error:null});}catch(__e){__tr.push({name:"'+sn+'",passed:false,error:__e.message});}';}
  tc+='return __tr;';
  var r=exec(code+'\n'+tc);
  if(r.error){resEl.innerHTML='<div class="text-red-400 text-xs"><i class="fa-solid fa-circle-xmark mr-1"></i>'+esc(r.error)+'</div>';return;}
  S.testRes=r.result;resEl.innerHTML=rTestRes(S.testRes);
  var allP=S.testRes.every(function(t){return t.passed;});
  if(allP){if(!isDone(mid,'lab')){markDone(mid,'lab');toast('Lab completed! All tests passed.','success',4000);}
  if(S.timerInt){clearInterval(S.timerInt);S.timerInt=null;}
  if(modProg(mid)===3)setTimeout(function(){toast('Module "'+MODS[mid-1].title+'" fully complete!','success',5000);},1000);}
  render();
}

// ===== MAIN RENDER =====
function render(){
  var app=document.getElementById('app');
  var sbCls='sb-d w-[250px] shrink-0 border-r border-fg-border bg-fg-surface h-full overflow-hidden flex flex-col transition-all duration-300'+(S.sbOpen?'':' -ml-[250px]');
  var sbHtml='<aside id="sidebar" class="'+sbCls+'">'+rSidebar()+'</aside>';
  var mainHtml='';
  if(S.view==='home')mainHtml='<main class="flex-1 overflow-y-auto">'+rHome()+'</main>';
  else if(S.view==='lesson')mainHtml='<main class="flex-1 overflow-y-auto">'+rLesson(S.mod)+'</main>';
  else if(S.view==='workshop')mainHtml='<main class="flex-1 overflow-hidden">'+rWorkshop(S.mod)+'</main>';
  else if(S.view==='lab')mainHtml='<main class="flex-1 overflow-hidden">'+rLab(S.mod)+'</main>';
  var mobHtml='<button onclick="togSB()" class="mob-btn fixed top-3 left-3 z-40 w-9 h-9 rounded-lg bg-fg-card border border-fg-border items-center justify-center text-fg-muted hover:text-fg-text transition-colors"><i class="fa-solid fa-bars text-sm"></i></button>';
  app.innerHTML=sbHtml+mainHtml+mobHtml;

  if(S.view==='workshop'){var ws=WSHOPS[S.mod];setTimeout(function(){var ed=makeEditor('ws-ed',S.showSol?ws.sol:ws.init);if(ed)ed.setOption('extraKeys',{'Ctrl-Enter':function(){runWs(S.mod);}});},30);}
  else if(S.view==='lab'){var lab=LABS[S.mod];setTimeout(function(){var ed=makeEditor('lab-ed',lab.init);if(ed)ed.setOption('extraKeys',{'Ctrl-Enter':function(){runLab(S.mod);}});
  if(!S.timerInt&&!isDone(S.mod,'lab')){S.timerInt=setInterval(function(){S.timer++;var el=document.getElementById('ltimer');if(el)el.textContent=String(Math.floor(S.timer/60)).padStart(2,'0')+':'+String(S.timer%60).padStart(2,'0');},1000);}},30);}
  else killEditor();

  if(S.view==='home'){setTimeout(function(){var cv=document.getElementById('pcanvas');if(cv)startParticles(cv);},100);}else stopParticles();
  if(S.view==='lesson'){setTimeout(function(){var blocks=document.querySelectorAll('#lcontent pre code');for(var i=0;i<blocks.length;i++)hljs.highlightElement(blocks[i]);},30);}
}

function togSB(){S.sbOpen=!S.sbOpen;var sb=document.getElementById('sidebar');if(sb){if(S.sbOpen)sb.classList.remove('-ml-[250px]');else sb.classList.add('-ml-[250px]');}}

go('home');
</script>
</body>
</html>
